# =============================================================================
# GaussianSplat_videoTools
# =============================================================================
# Modern Python project definition. Read by uv to bootstrap the venv,
# pin dependencies, and expose CLI entry points.
#
# Standards: pure ASCII, no curly quotes or em-dashes.

[project]
name = "gs-videotools"
version = "0.1.0"
description = "Video-to-Gaussian-splat pipeline tools for MAKE Visual VFX work."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "MAKE Visual pipeline", email = "pipeline@makevisual.com" }]
license = { text = "Proprietary - MAKE Visual internal use" }

# Direct dependencies of THIS project's code. SHARP itself is installed
# separately by setup.ps1 (it's not on PyPI; it ships from Apple's GitHub).
dependencies = [
    "numpy>=2.0,<3.0",
    "plyfile>=1.0,<2.0",
    "imageio>=2.30,<3.0",
]

# Tools installed only for development (testing, linting). Not needed at runtime.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# CLI entry points. After install, `gs-filter` and `gs-footage-to-splats`
# become callable from anywhere inside the activated venv.
[project.scripts]
gs-filter            = "gs_videotools.splat_filter:main"
gs-footage-to-splats = "gs_videotools.footage_to_splats:main"
gs-version-check     = "gs_videotools.version_check:main"

# =============================================================================
# Build backend
# =============================================================================
# We use hatchling because it's the modern, minimal default for uv projects.
# No setup.py, no compiled extensions, no surprises.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gs_videotools"]
